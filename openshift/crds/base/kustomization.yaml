commonAnnotations:
  include.release.openshift.io/ibm-cloud-managed: "true"
  include.release.openshift.io/self-managed-high-availability: "true"
  include.release.openshift.io/single-node-developer: "true"
  capability.openshift.io/name: baremetal

resources:
- ../../../config/base/crds

patches:
# NOTE(dtantsur): upstream adds this for the conversion webhook
- target:
    kind: CustomResourceDefinition
    name: baremetalhosts.metal3.io
  patch: |
    - op: remove
      path: /metadata/annotations/cert-manager.io~1inject-ca-from
    - op: remove
      path: /spec/conversion
# NOTE(dtantsur): HostClaims are a gated feature
- target:
    kind: CustomResourceDefinition
    name: hostclaims.metal3.io
  patch: |
    - op: add
      path: /metadata/annotations/release.openshift.io~1feature-gate
      value: "MetalHostClaimsAPI"
- target:
    kind: CustomResourceDefinition
    name: hostdeploypolicies.metal3.io
  patch: |
    - op: add
      path: /metadata/annotations/release.openshift.io~1feature-gate
      value: "MetalHostClaimsAPI"
